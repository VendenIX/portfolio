- title: Experience
  type: time_table
  contents:
    - title: AI Engineer — Federated Learning for Medical Imaging
      institution: Centre François Baclesse, Caen
      year: 09/25 – 06/26
      description:
        - Fixed-term contract contributing to a national federated learning project advancing personalized medicine through improved survival prediction for glioblastoma patients, building on prior Master's work in explainable AI.
        - Collaborated with a multi-institutional team from Inria and several French cancer centers to design and implement technical solutions.
        - Trained a deep learning model on distributed data using the Fed-BioMed framework, ensuring patient data privacy throughout.
        - Managed the project's data pipeline, including standardization and anonymization of multi-center datasets.
        - Addressed complex architectural challenges inherent to federated learning environments.
    - title: Research and Development Intern, Explainability
      institution: Centre François Baclesse, Caen
      year: 03/25 – 08/25
      description:
        - Explored and applied explainability techniques (Grad-CAM, LIME, LRP) to understand the predictions of a ResNet-51q model for glioblastoma treatment response.
        - Ran statistical analysis and validation against clinical data to ensure the relevance and robustness of the generated explanations.
        - Compared explainability methods and identified the model's limitations across patient cases.
        - Wrote and submitted a scientific article presenting the research outcomes to a peer-reviewed venue.
        - title: Skills strengthened
          contents:
            - Deep learning & explainability (ResNet, Grad-CAM, LIME, LRP)
            - Medical image analysis (MRI, segmentation, feature extraction)
            - Statistics and validation of AI models applied to healthcare
            - Scientific writing and the publication process
    - title: Research and Development Intern, Medical AI
      institution: Centre François Baclesse, Caen
      year: 05/24 – 07/24
      description:
        - Continuation of a Master's project creating a visualization interface and API for a deep learning algorithm for automatic brain lesion segmentation on MRI, under the supervision of Dr. Corroyer-Dulmont (Head of AI and Medical Imaging Engineer at CFB).
        - Deployed, finalized, and optimized an interface based on OHIF Viewer and its API on the center's Windows environments (ML Ops).
        - Optimized and retrained the deep learning model on a new dataset to reduce computational cost.
        - title: Outcome
          contents:
            - Co-first author, "Development and routine implementation of a deep learning algorithm for automatic brain metastases segmentation on MRI for RANO-BM criteria follow-up", NeuroImage, Vol. 306 (2025).
      linkitems:
