- id: post-xai-align
  objective: jiim-publication
  title: Project post aligned with the published paper
  goal: Rewrite _posts/2025-08-01-xai-glioblastoma-treatment-response.md (description, pipeline, findings,
    outcome) so every claim is supported by the published JIIM paper
  agent: implementer
  description: 'Source: out/work/post-xai-align/paper.txt (text of private/Andres et al. - 2026 - ....pdf).

    Owner decisions (2026-10-15): align the post on the paper; causal activation patching is kept

    only as an exploratory part of the internship, explicitly not retained in the paper; code link

    stays github.com/VendenIX/GBM-Treatment-Response-XAI; main link is the DOI

    https://doi.org/10.1007/s10278-026-02381-5 (open access, CC BY-NC-ND).

    Known errors of the current post: the finding is a high-intensity heuristic (hyper-intense

    pixels at the surgical site / skull periphery drive "Long-Term", tumour enhancement drives

    "Short-Term"); the resection-status proxy is only a plausible interpretation in the paper,

    not a confirmed fact. The model (ResNet-51q, AUC 0.89) comes from a previous study and was

    audited, not trained, in this work.

    '
  scope: content
  priority: 1
  status: done
  depends_on:
  - pub-jiim-meta
  success:
  - every number and claim of the post can be pointed to in paper.txt
  - outcome section gives authors exactly as in the paper, journal, 2026, online 13 October 2026, DOI
    link, keywords not required
  - activation patching, if mentioned, is presented as exploratory and not part of the paper
  - sober academic English (D-007), length similar to the current post
  failure:
  - a claim needs a fact not in the paper nor given by the owner
  files:
  - _posts/2025-08-01-xai-glioblastoma-treatment-response.md
  context:
  - D-005
  - D-007
  - AGENTS.md
  validation:
  - tools/build.sh
  - python3 tools/check_site.py
  - '! grep -qi "under review" _posts/2025-08-01-xai-glioblastoma-treatment-response.md'
  review_required: true
  attempts:
  - date: '2026-10-15'
    agent: implementer
    outcome: success
    summary: post rewritten on the published paper (intensity heuristic, ablation, probing, reader study;
